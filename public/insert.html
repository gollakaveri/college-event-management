
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add College Event</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>
    <h1>🎓 Kaveri's College Event Management</h1>
    <p>Add a new event to your college</p>

    <nav>
        <a href="index.html">Home</a>
        <a href="list.html">All Events</a>
        <a href="listOne.html">Search Event</a>
        <a href="insert.html">Add Event</a>
        <a href="update.html">Update Event</a>
        <a href="delete.html">Delete Event</a>
    </nav>
</header>

<main>
    <div class="card">
        <img loading="lazy"
            class="event-image"
            src="assets/add.svg"
            alt="College event">

        <h2>Register a New Event</h2>
        <p>Enter the details below to add an event.</p>

        <form id="eventForm">

            <label for="event_id">Event ID</label>
            <input
                type="number"
                id="event_id"
                name="event_id"
                min="1"
                required
                placeholder="Enter unique Event ID">

            <label for="event_name">Event Name</label>
            <input
                type="text"
                id="event_name"
                name="event_name"
                required
                placeholder="Enter event name">

            <label for="event_type">Event Type</label>
            <select id="event_type" name="event_type" required>
                <option value="">-- Select event type --</option>
                <option value="Technical">Technical</option>
                <option value="Cultural">Cultural</option>
                <option value="Sports">Sports</option>
                <option value="Workshop">Workshop</option>
                <option value="Other">Other</option>
            </select>

            <label for="event_date">Event Date</label>
            <input
                type="date"
                id="event_date"
                name="event_date"
                required>

            <label for="venue">Venue</label>
            <input
                type="text"
                id="venue"
                name="venue"
                required
                placeholder="Enter venue">

            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Enter event description"></textarea>

            <button type="submit">Save Event</button>
            <button type="reset">Clear Form</button>
        </form>

        <p id="message" class="message"></p>
    </div>
</main>

<script>
const form = document.getElementById("eventForm");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const data = Object.fromEntries(new FormData(form).entries());

    try {
        const response = await fetch("/events", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(data)
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Unable to add event");
        }

        message.textContent = result.message;
        form.reset();

    } catch (error) {
        message.textContent = "Error: " + error.message;
    }
});

form.addEventListener("reset", function() {
    message.textContent = "";
});
</script>

<footer>College Event Management System</footer>
    <script src="app.js" defer></script>
</body>
</html>
